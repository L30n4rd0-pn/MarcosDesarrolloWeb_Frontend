<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoRecycle - Iniciar Sesión</title>
    <link rel="stylesheet" href="/css/index.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
    <main class="login-container">
        <div class="top-logo">
            <img src="/img/logo.png" alt="Recíclate Consciente">
        </div>

        <section class="form-side">
            <div class="login-card">
                <h2>Iniciar Sesión</h2>

                <form>
                    <div class="input-group">
                        <label>Correo Electrónico</label>
                        <div class="input-wrapper">
                            <i class='bx bx-envelope'></i>
                            <input type="email" placeholder="Correo Electrónico">
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Contraseña</label>
                        <div class="input-wrapper">
                            <i class='bx bx-lock-alt'></i>
                            <input type="password" placeholder="Contraseña">
                            <i class='bx bx-show eye-icon'></i>
                        </div>
                        <a href="#" class="forgot-link">Olvidaste tu Contraseña</a>
                    </div>

                    <button type="submit" class="btn-ingresar">Ingresar</button>
                </form>

                <div class="divider">
                    <span>O continúa con</span>
                </div>

                <div class="social-login">
                    <button class="social-btn"><i class="bi bi-google"></i></button>
                    <button class="social-btn"><i class="bi bi-facebook"></i></button>
                </div>

                <p class="register-text">¿No tienes cuenta? <a href="#">Regístrate</a></p>
            </div>
        </section>

    </main>
</body>
</html>
